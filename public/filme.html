<script>

    window.onload = function() {
        validarLogin();
        if (!idFilme) {
            alert("Filme não encontrado!");
            window.location.href = "index.html";
        } else {
            buscarDadosDoFilme();
            if (sessionStorage.ID_USUARIO) {
                buscarStatusInteracao();
                obterDadosPerfil(sessionStorage.ID_USUARIO);
            }
        }
    };

    function validarLogin() {
        let email = sessionStorage.EMAIL_USUARIO;
        let nome = sessionStorage.NOME_USUARIO;

        let navbar = document.querySelector(".navbar");
        let li_cadastro = document.getElementById("li_cadastro");
        let li_entrar = document.getElementById("li_entrar");
        let li_perfil = document.getElementById("li_perfil");
        let li_inicio = document.getElementById("li_inicio");
        let footer_id = document.getElementById("footer_id");

        if (email != null && nome != null) {
            li_cadastro.style.display = "none";
            li_entrar.style.display = "none";
            li_perfil.style.display = "block";
            footer_id.innerHTML = `<span>Páginas</span>
              <a href="index.html">Início</a>
              <a href="perfil/diario.html">Perfil</a>`;
            navbar.style.width = "120px";
        } else {
            li_cadastro.style.display = "block";
            li_entrar.style.display = "block"; 
            li_perfil.style.display = "none";
            footer_id.innerHTML = `<span>Páginas</span>
              <a href="index.html">Início</a>
              <a href="cadastro.html">Cadastrar</a>
              <a href="login.html">Entrar</a>`;
            navbar.style.width = "270px";
        }
    }

    function obterDadosPerfil(idUsuario) {
        fetch(`/usuarios/buscarPerfil/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dados) {
                    console.log("Dados do perfil recebidos: ", JSON.stringify(dados));
                    
                    document.getElementById("nome_usuario_perfil").innerHTML = dados.nome;
                    
                    document.getElementById("foto_usuario_perfil").src = dados.foto;
                });
            } else {
                console.log("Houve um erro ao tentar recuperar os dados do perfil!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }
        })
        .catch(function (erro) {
            console.log("Erro de rede/servidor: ", erro);
        });
    }


    // pega o ID da URL
    const urlParams = new URLSearchParams(window.location.search);
    const idFilme = urlParams.get('id');

    // pega os dados do filme do banco de dados
    function buscarDadosDoFilme() {
        fetch(`/filmes/buscar/${idFilme}`, {
            method: "GET",
            headers: { "Content-Type": "application/json" }
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json); // console log do json dos dados do filme
                    preencherPagina(json[0]); // manda o json como parametro para a função de preenchimento
                });
            } else {
                console.error('Erro na busca do filme');
            }
        })
        .catch(function (erro) {
            console.log(erro);
        });
    }

    // preenche a página com os dados que acabamos de pegar do banco
    function preencherPagina(filme) {
        document.title = `V-Filmes | ${filme.titulo}`;
        document.getElementById("titulo_filme").innerHTML = filme.titulo;
        document.getElementById("descricao_filme").innerHTML = filme.descricao;
        document.getElementById("elenco_filme").innerHTML = filme.elenco;
        document.getElementById("diretor_filme").innerHTML = filme.diretor;
        document.getElementById("info_filme").innerHTML = `${filme.ano} • ${filme.duracao_minutos}min`;
        document.getElementById("img_filme").src = filme.link_poster;
        document.getElementById("banner_filme").style.backgroundImage = `url('${filme.link_banner}')`;
    }

    // já deixa a página preenchida com as interações desse usuário registradas no banco
    function buscarStatusInteracao() {
    const idUsuario = sessionStorage.ID_USUARIO;
    fetch(`/interacoes/status/${idUsuario}/${idFilme}`)
        .then(res => {
            if (res.status == 200) {
                res.json().then(status => {
                    
                    if (status.visualizacao == 1) {
                        document.getElementById("view").src = "assets/imgs/olho-selected.png";
                    } else {
                        document.getElementById("view").src = "assets/imgs/olho-not-selected.png";
                    }

                    if (status.curtida == 1) {
                        document.getElementById("like").src = "assets/imgs/coracao-selected.png";
                    } else {
                        document.getElementById("like").src = "assets/imgs/coracao-not-selected.png";
                    }

                    if (status.watchlist == 1) {
                        document.getElementById("watchlist").src = "assets/imgs/wachtlist-selected.png";
                    } else {
                        document.getElementById("watchlist").src = "assets/imgs/wachtlist-not-selected.png";
                    }

                });
            }
        });
    }

    // função para registrar a interação, passando o tipo de interação como parametro
    function registrarInteracao(tipo) {

    const idUsuario = sessionStorage.ID_USUARIO;

    if (!idUsuario) {
        return alert("Faça login para interagir!");
    }

    fetch("/interacoes/registrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            idUsuarioServer: idUsuario,
            idFilmeServer: idFilme,
            tipoServer: tipo
        })
    }).then(res => {
        if (res.ok) {
            // se a interação for concluída, ele chama a função de preencher os ícones de interações de acordo com o banco
            buscarStatusInteracao(); 
        }
    });
    }
</script>
