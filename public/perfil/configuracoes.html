<body>

    <div class="header">
      <div class="container">
        <a href="../index.html"><img src="../assets/imgs/logo-branco.png" alt="logo-branco"></a>
        <ul class="navbar">
          <li id="li_cadastro">
            <a href="cadastro.html"><p>Cadastrar</p></a>
          </li>
          <li id="li_entrar">
            <a href="login.html">
              <div class="botao-entrar-ofc"><p>Entrar</p></div>
            </a>
          </li>

          <li id="li_perfil" style="display: none;">
            <a href="#">
              <div class="botao-entrar">
                <div class="foto-perfil-header">
                    <img id="foto_usuario_perfil_header" src="" alt="Foto de Perfil">
                </div>
                <p id="nome_usuario_perfil_header"></p>
              </div>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="pagina">
    <div class="container perfil-container">
        <div class="perfil-header">
            <div class="perfil-info">
                <div class="foto-perfil">
                    <img id="foto_usuario_perfil" src="" alt="Foto de Perfil">
                </div>
                <div class="texto-perfil">
                    <h1 id="nome_usuario_perfil">Nome do Usuário</h1>
                    <p class="descricao" id="descricao_usuario_perfil"></p>
                </div>
            </div>

            <div class="perfil-stats">
                <div class="stat-item">
                    <span class="stat-valor" id="stat_filmes">0</span>
                    <span class="stat-label">Filmes</span>
                </div>
                <div class="stat-item border-left">
                    <span class="stat-valor" id="stat_curtidas">0</span>
                    <span class="stat-label">Curtidas</span>
                </div>
                <div class="stat-item border-left">
                    <span class="stat-valor" id="stat_watchlist">0</span>
                    <span class="stat-label">Watchlist</span>
                </div>
            </div>
        </div>

        <div class="perfil-abas">
            <ul>
                <a href="diario.html"><li>Diário</li></a>
                <a href="estatisticas.html"><li>Estatísticas</li></a>
                <a href="configuracoes.html"><li class="aba-ativa">Configurações</li></a>
            </ul>
        </div>
        
        <div class="aba-conteudo">
            <div class="form-configuracoes">
                <h1>Editar Perfil</h1>
                
                <div class="campo-input">
                    <label for="input_nome">Nome de Usuário</label>
                    <input type="text" id="input_nome" placeholder="Seu nome">
                </div>

                <div class="campo-input">
                    <label for="input_foto">Link da Foto de Perfil (Web URL)</label>
                    <input type="text" id="input_foto" placeholder="https://exemplo.com/sua-foto.jpg">
                </div>

                <div class="campo-input">
                    <label for="input_bio">Biografia / Descrição</label>
                    <textarea id="input_bio" rows="3" placeholder="Conte um pouco sobre você..."></textarea>
                </div>

                <div class="campo-input">
                    <label for="input_senha">Nova Senha (deixe em branco para não alterar)</label>
                    <input type="password" id="input_senha" placeholder="******">
                </div>

                <div class="botoes-acoes">
                    <button class="btn-salvar" onclick="atualizarPerfil()">Salvar Alterações</button>
                    <button class="btn-sair" onclick="limparSessao()">Sair da Conta</button>
                </div>
            </div>
        </div>
        </div>
    </div>
        
    <div class="footer">
      <div class="container">
        <div class="logo">
          <a href="../index.html"><img src="../assets/imgs/logo-branco.png" alt="logo-branco"></a>

          <div class="footer_col" id="footer_id">

              <a href="../index.html">Início</a>
              <a href="diario.html">Perfil</a>
          </div>

          <div class="footer_col">
              <span>Desenvolvedor</span>
              <a href="https://github.com/Gabriel-Veras-SPTECH"><i class="fa-brands fa-github"></i>GitHub</a>
              <a href="https://www.linkedin.com/in/gabriel-veras-soares-152a762b7/"><i class="fa-brands fa-linkedin"></i>Linkedin</a>
              <a href="https://www.instagram.com/gabrielo_veras"><i class="fa-brands fa-instagram"></i>Instagram</a>
          </div>
    </div>
    </div>

    <div class="rodape_final">
      <h4>&copy; Gabriel Veras, <span>SPTech 2026</span></h4>

</body>

<script>
    window.onload = function() {
        validarLogin();
        if (sessionStorage.ID_USUARIO) {
            obterDadosPerfil(sessionStorage.ID_USUARIO);
        } else {
            window.location = "../login.html";
        }
    };

    function validarLogin() {
        let email = sessionStorage.EMAIL_USUARIO;
        let nome = sessionStorage.NOME_USUARIO;

        let navbar = document.querySelector(".navbar");
        let li_cadastro = document.getElementById("li_cadastro");
        let li_entrar = document.getElementById("li_entrar");
        let li_perfil = document.getElementById("li_perfil");

        if (email != null && nome != null) {
            li_cadastro.style.display = "none";
            li_entrar.style.display = "none";
            li_perfil.style.display = "block";
            navbar.style.width = "200px";
        } else {
            li_cadastro.style.display = "block";
            li_entrar.style.display = "block"; 
            li_perfil.style.display = "none";
            navbar.style.width = "200px";
        }
    }

    function obterDadosPerfil(idUsuario) {
        fetch(`/usuarios/buscarPerfil/${idUsuario}`, {
            method: "GET",
            headers: { "Content-Type": "application/json" }
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dados) {
                    document.getElementById("nome_usuario_perfil").innerHTML = dados.nome;
                    document.getElementById("descricao_usuario_perfil").innerHTML = dados.bio ? dados.bio : "Sem biografia definida.";
                    
                    if (dados.foto) {
                        document.getElementById("foto_usuario_perfil").src = dados.foto;
                        // Preenche o input caso já possua foto personalizada da web
                        if(dados.foto != '../assets/imgs/profile-icon-generic.png') {
                            document.getElementById("input_foto").value = dados.foto;
                        }
                    }

                    document.getElementById("stat_filmes").innerHTML = dados.total_filmes;
                    document.getElementById("stat_curtidas").innerHTML = dados.total_curtidas;
                    document.getElementById("stat_watchlist").innerHTML = dados.total_watchlist;

                    // Preenche os campos do formulário para edição
                    document.getElementById("input_nome").value = dados.nome;
                    document.getElementById("input_bio").value = dados.bio ? dados.bio : "";
                });
            }
        });
    }

    function obterDadosPerfil(idUsuario) {
        fetch(`/usuarios/buscarPerfil/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dados) {
                    console.log("Dados do perfil recebidos: ", JSON.stringify(dados));
                    
                    // atualiza nome
                    document.getElementById("nome_usuario_perfil").innerHTML = dados.nome;
                    document.getElementById("nome_usuario_perfil_header").innerHTML = dados.nome;
                    
                    // se a bio estiver nula ou vazia, coloca uma mensagem padrão
                    document.getElementById("descricao_usuario_perfil").innerHTML = dados.bio;
                    
                    // se tiver foto registrada, altera o src da imagem
                    if (dados.foto) {
                        document.getElementById("foto_usuario_perfil").src = dados.foto;
                        document.getElementById("foto_usuario_perfil_header").src = dados.foto;

                        // preenche o input caso já possua foto personalizada da web
                        if(dados.foto != '../assets/imgs/profile-icon-generic.png') {
                            document.getElementById("input_foto").value = dados.foto;
                        }
                    }

                    // atualiza os contadores/stats do user
                    document.getElementById("stat_filmes").innerHTML = dados.total_filmes;
                    document.getElementById("stat_curtidas").innerHTML = dados.total_curtidas;
                    document.getElementById("stat_watchlist").innerHTML = dados.total_watchlist;

                    // preenche os campos do formulário para edição
                    document.getElementById("input_nome").value = dados.nome;
                    document.getElementById("input_bio").value = dados.bio ? dados.bio : "";
                    
                });
            } else {
                console.log("Houve um erro ao tentar recuperar os dados do perfil!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }
        })
        .catch(function (erro) {
            console.log("Erro de rede/servidor: ", erro);
        });
    }

    function atualizarPerfil() {
        var idUsuario = sessionStorage.ID_USUARIO;
        var nomeVar = document.getElementById("input_nome").value;
        var fotoVar = document.getElementById("input_foto").value;
        var bioVar = document.getElementById("input_bio").value;
        var senhaVar = document.getElementById("input_senha").value;

        if (nomeVar == "") {
            alert("O nome não pode ficar em branco.");
            return false;
        }

        fetch(`/usuarios/atualizar/${idUsuario}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nomeVar,
                fotoServer: fotoVar == "" ? null : fotoVar, // se estiver vazio mantém o default pelo banco ou lógica
                bioServer: bioVar,
                senhaServer: senhaVar == "" ? null : senhaVar // envia null se o usuário optou por não mudar a senha
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Perfil atualizado com sucesso!");
                // atualiza o sessionStorage caso tenha mudado o nome
                sessionStorage.NOME_USUARIO = nomeVar;
                window.location.reload();
            } else {
                alert("Houve um erro ao atualizar o perfil.");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }

    function limparSessao() {
        sessionStorage.clear();
        window.location = "../index.html";
    }
</script>
</html>
