<script>

    window.onload = function() {
        validarLogin();
        
        if (sessionStorage.ID_USUARIO) {
            obterDadosPerfil(sessionStorage.ID_USUARIO);
            obterDiario(sessionStorage.ID_USUARIO);
        } else {
            window.location = "../login.html";
        }
    };

    function validarLogin() {
        let email = sessionStorage.EMAIL_USUARIO;
        let nome = sessionStorage.NOME_USUARIO;

        let navbar = document.querySelector(".navbar");
        let li_cadastro = document.getElementById("li_cadastro");
        let li_entrar = document.getElementById("li_entrar");
        let li_perfil = document.getElementById("li_perfil");

        if (email != null && nome != null) {
            li_cadastro.style.display = "none";
            li_entrar.style.display = "none";
            li_perfil.style.display = "block";
            navbar.style.width = "200px";
        } else {
            li_cadastro.style.display = "block";
            li_entrar.style.display = "block"; 
            li_perfil.style.display = "none";
            navbar.style.width = "200px";
        }
    }

    function obterDadosPerfil(idUsuario) {
        fetch(`/usuarios/buscarPerfil/${idUsuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dados) {
                    console.log("Dados do perfil recebidos: ", JSON.stringify(dados));
                    
                    // atualiza nome
                    document.getElementById("nome_usuario_perfil").innerHTML = dados.nome;
                    document.getElementById("nome_usuario_perfil_header").innerHTML = dados.nome;
                    
                    // se a bio estiver nula ou vazia, coloca uma mensagem padrão
                    document.getElementById("descricao_usuario_perfil").innerHTML = dados.bio;
                    
                    // se tiver foto registrada, altera o src da imagem
                    if (dados.foto) {
                        document.getElementById("foto_usuario_perfil").src = dados.foto;
                        document.getElementById("foto_usuario_perfil_header").src = dados.foto;
                    }

                    // atualiza os contadores/stats do user
                    document.getElementById("stat_filmes").innerHTML = dados.total_filmes;
                    document.getElementById("stat_curtidas").innerHTML = dados.total_curtidas;
                    document.getElementById("stat_watchlist").innerHTML = dados.total_watchlist;
                });
            } else {
                console.log("Houve um erro ao tentar recuperar os dados do perfil!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }
        })
        .catch(function (erro) {
            console.log("Erro de rede/servidor: ", erro);
        });
    }

function obterDiario(idUsuario) {
        fetch(`/usuarios/diario/${idUsuario}`, {
            method: "GET",
            headers: { "Content-Type": "application/json" }
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (historico) {
                    console.log("Histórico do diário: ", historico);
                    
                    var divRolagem = document.querySelector(".rolagem-diario");
                    divRolagem.innerHTML = ""; 

                    if (historico.length == 0) {
                        divRolagem.innerHTML = `<p class="feed-vazio">Você ainda não interagiu com nenhum filme.</p>`;
                        return;
                    }

                    for (var i = 0; i < historico.length; i++) {
                        var registro = historico[i];

                        // transformando os 0s e 1s no src da imagem correspondente
                        var srcAssistido = registro.visualizacao == 1 ? "../assets/imgs/olho-selected.png" : "../assets/imgs/olho-not-selected.png";
                        var srcCurtido = registro.curtida == 1 ? "../assets/imgs/coracao-selected.png" : "../assets/imgs/coracao-not-selected.png";
                        var srcWatchlist = registro.watchlist == 1 ? "../assets/imgs/wachtlist-selected.png" : "../assets/imgs/wachtlist-not-selected.png";

                        // transformando os meses de numeros para seus nomes
                        var meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                        var nomeMes = meses[registro.mes_interacao - 1];
                        var dia = registro.dia_interacao;
                        var ano = registro.ano_interacao;

                        // adiciona os cards das interacoes feitas de acordo com as datas
                        divRolagem.innerHTML += `
                            <div class="card-diario-item">
                                <div class="data-badge">
                                    <span class="dia">${dia}</span>
                                    <span class="mes-ano">${nomeMes} / ${ano}</span>
                                </div>
                                <div class="poster-diario">
                                    <img src="${registro.link_poster}">
                                </div>
                                <div class="detalhes-diario">
                                    <h3>${registro.titulo}</h3>
                                    <div class="icones-status">
                                        <img src="${srcAssistido}" alt="Assistido" title="Assistido" class="icone-diario-img">
                                        <img src="${srcCurtido}" alt="Curtido" title="Curtido" class="icone-diario-img">
                                        <img src="${srcWatchlist}" alt="Watchlist" title="Watchlist" class="icone-diario-img">
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });
            } else {
                console.error("Erro ao recuperar o diário do usuário.");
            }
        })
        .catch(function (erro) {
            console.log("Erro no fetch do diário: ", erro);
        });
    }

</script>
