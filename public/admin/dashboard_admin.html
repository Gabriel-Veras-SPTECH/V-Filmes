<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/icon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Filmes | Perfil</title>


    <link rel="stylesheet" href="../css/admin.css">

    <!-- Link Google Fonts -->
    <link rel="icon" href="./assets/icon/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Darker+Grotesque:wght@300..900&family=League+Spartan:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
       
    <!-- Link FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="janela">
        <div class="header-left">
            
            <div class="header-left-content">

                <img src="../assets/imgs/logo-branco.png" alt="logo-branco">

                <div class="hello">
                    <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                </div>

                <a href="#" class="sla">
                <div class="btn-nav-selected">
                        <h3>Dashboard</h3>
                </div>
                </a>

                <a href="cadastro_de_filmes.html" class="sla">
                <div class="btn-nav">

                    <h3>Cadastrar filme</h3>

                </div>
                </a>

                <div class="btn-logout" onclick="limparSessao()">
                    <h3>Sair</h3>
                </div>

            </div>

        </div>

        <div class="dash">

            <h1>Dashboard <span>Admin</span></h1>
            
            <div class="kpi-container">
                <div class="kpi-card">
                    <span class="kpi-titulo">Usuários Cadastrados</span>
                    <span class="kpi-valor" id="kpi_usuarios">0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-titulo">Filmes no Catálogo</span>
                    <span class="kpi-valor" id="kpi_filmes">0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-titulo">Visualizações Totais</span>
                    <span class="kpi-valor" id="kpi_views">0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-titulo">Curtidas Totais</span>
                    <span class="kpi-valor" id="kpi_curtidas">0</span>
                </div>
            </div>

            <div class="graph-section">
                <div class="graph-box">
                    <h3>Gêneros mais assistidos na Rede</h3>
                    <canvas id="chartGenerosGlobais"></canvas>
                </div>
                <div class="graph-box">
                    <h3>Top 5 Filmes mais Favoritados</h3>
                    <canvas id="chartFilmesPopulares"></canvas>
                </div>
            </div>

        </div>
    </div>

</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = function() {
        if (!sessionStorage.ID_USUARIO) {
            window.location = "../login.html";
        } else {
            carregarKpis();
            carregarGraficoGeneros();
            carregarGraficoFilmes();
        }
    };

    function carregarKpis() {
        fetch("/admin/kpis")
        .then(resposta => resposta.json())
        .then(dados => {
            document.getElementById("kpi_usuarios").innerHTML = dados.total_usuarios;
            document.getElementById("kpi_filmes").innerHTML = dados.total_filmes;
            document.getElementById("kpi_views").innerHTML = dados.total_visualizacoes;
            document.getElementById("kpi_curtidas").innerHTML = dados.total_curtidas;
        })
        .catch(erro => console.error("Erro ao carregar KPIs do admin:", erro));
    }

    function carregarGraficoGeneros() {
        fetch("/admin/grafico-generos")
        .then(resposta => resposta.json())
        .then(dados => {
            let labels = [];
            let valores = [];
            
            dados.forEach(item => {
                labels.push(item.genero);
                valores.push(item.qtd);
            });

            const ctx = document.getElementById('chartGenerosGlobais').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: ['#4303c3', '#32b9cd', '#ffce56', '#2f9e44', '#9c27b0'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#fff' } }
                    }
                }
            });
        });
    }

    function carregarGraficoFilmes() {
        fetch("/admin/grafico-filmes")
        .then(resposta => resposta.json())
        .then(dados => {
            let labels = [];
            let valores = [];
            
            dados.forEach(item => {
                labels.push(item.titulo);
                valores.push(item.curtidas);
            });

            const ctx = document.getElementById('chartFilmesPopulares').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Curtidas',
                        data: valores,
                        backgroundColor: '#4303c3',
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    scales: {
                        x: { ticks: { color: '#fff', stepSize: 1, precision: 0 }, grid: { display: false } },
                        y: { ticks: { color: '#fff' }, grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        });
    }

    function limparSessao() {
        sessionStorage.clear();
        window.location = "../login.html";
    }
</script>

</html>
