<script>
  

  function cadastrar() {
    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = `<span style="color:red;">Preencha todos os campos.</span>`;

      setTimeout(sumirMensagem, 5000);
      finalizarAguardar();
      return false;
    }

    // verifica se tem @ e se em seguida tem .com no email
    var posicaoArroba = emailVar.indexOf('@');
    var emailValido = posicaoArroba > 0 && emailVar.endsWith('.com');

  // for para checar se tem número na senha
    let temNumero = false;
    for (let i = 0; i < senhaVar.length; i++) {
        let caractereAtual = senhaVar[i];

        if (caractereAtual >= '0' && caractereAtual <= '9') {
            temNumero = true;
            break;
        }
    }

    let minusculas = "abcdefghijklmnopqrstuvwxyz";
    let maiusculas = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let temMinuscula = false;
    let temMaiuscula = false;
    
    // for para checar se tem letra minúscula
    for (let i = 0; i < senhaVar.length; i++) {
        let caractereAtual = senhaVar[i];

        for (let j = 0; j < minusculas.length; j++) {
          let letraAtual = minusculas[j];
          if (caractereAtual == letraAtual) {
              temMinuscula = true;
              break;
          }
        }
    }

    // for para checar se tem letra maiúscula
    for (let i = 0; i < senhaVar.length; i++) {
        let caractereAtual = senhaVar[i];

        for (let j = 0; j < maiusculas.length; j++) {
          let letraAtual = maiusculas[j];
          if (caractereAtual == letraAtual) {
              temMaiuscula = true;
              break;
          }
        }
    }

    let simbolos = "[!@#$%*()_+^&}{:;?.]";
    let temSimbolo = false;
    // for para checar se tem símbolo
    for (let i = 0; i < senhaVar.length; i++) {
        let caractereAtual = senhaVar[i];

        for (let j = 0; j < simbolos.length; j++) {
          let letraAtual = simbolos[j];
          if (caractereAtual == letraAtual) {
              temSimbolo = true;
              break;
          }
        }
    }

    let qtdCaracteres = 0;
    // for para checar quantos caracteres tem
    for (let i = 0; i < senhaVar.length; i++) {
        qtdCaracteres++;
    }


    if (senhaVar != confirmacaoSenhaVar) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = `<span style="color:red;">A senha e a sua confirmação estão diferentes.</span>`;
        setTimeout(sumirMensagem, 7000);
        return false;
    } else if (!emailValido) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = `<span style="color:red;">O seu e-mail deve ter @ e depois .com</span>`;
        setTimeout(sumirMensagem, 7000);
        return false;
    }else if (qtdCaracteres < 8) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = `<span style="color:red;">A senha deve ter pelo menos 8 caracteres.</span>`;
        setTimeout(sumirMensagem, 7000);
        return false;
    } else if (temNumero == false || temMinuscula == false || temMaiuscula == false || temSimbolo == false) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = `<span style="color:red;">A senha deve ter pelo menos um número, uma letra minúscula, uma letra maiúscula e um caractere especial.</span>`;
        setTimeout(sumirMensagem, 7000);
        return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
